name: Deploy to FTP

on:
  push:
    branches:
      - main
  schedule:
    # Refresh bobboTrade's market/energy/analyst data hourly.
    - cron: "0 * * * *"
  workflow_dispatch: {}

jobs:
  # deploy / deploy-injections / deploy-artemis only need to run when
  # something actually changed (a push), not on bobboTrade's hourly data
  # refresh schedule.
  deploy:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: public_html/bobcooleyphoto/photo-mentor/
          local-dir: ./
          exclude: |
            **/.git*
            **/.git*/**
            **/node_modules/**
            .github/**
            injections/**
            bobboTrade/**

  deploy-injections:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy injections.css to bobcooleyphoto.com root
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: public_html/bobcooleyphoto/
          local-dir: ./injections/
          exclude: |
            **/.git*
            **/.git*/**

  deploy-artemis:
    if: github.event_name != 'schedule'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Deploy artemis to bobcooleyphoto.com/artemis/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: public_html/bobcooleyphoto/artemis/
          local-dir: ./artemis/
          exclude: |
            **/.git*
            **/.git*/**

  deploy-bobbotrade:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: bobboTrade/package-lock.json

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install frontend dependencies
        working-directory: bobboTrade
        run: npm ci

      - name: Install data pipeline dependencies
        working-directory: bobboTrade/data/fetch
        run: pip install -r requirements.txt

      - name: Fetch market/energy/analyst/news data
        working-directory: bobboTrade/data/fetch
        env:
          TWELVEDATA_API_KEY: ${{ secrets.TWELVEDATA_API_KEY }}
          EIA_API_KEY: ${{ secrets.EIA_API_KEY }}
          FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
        run: python run_all.py

      - name: Build frontend
        working-directory: bobboTrade
        run: npm run build

      - name: Deploy bobboTrade to bobcooleyphoto.com/bobboTrade/
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.FTP_HOST }}
          username: ${{ secrets.FTP_USER }}
          password: ${{ secrets.FTP_PASS }}
          server-dir: public_html/bobcooleyphoto/bobboTrade/
          local-dir: ./bobboTrade/dist/
          exclude: |
            **/.git*
            **/.git*/**
