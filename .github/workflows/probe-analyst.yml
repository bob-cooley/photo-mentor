name: Probe analyst sources (temporary)

on: workflow_dispatch

jobs:
  probe:
    runs-on: ubuntu-latest
    env:
      FINNHUB_API_KEY: ${{ secrets.FINNHUB_API_KEY }}
    steps:
      - name: Finnhub endpoints for MPC and COP
        run: |
          for T in MPC COP; do
            for EP in "stock/upgrade-downgrade?symbol=$T" "stock/price-target?symbol=$T" "stock/recommendation?symbol=$T"; do
              echo "== finnhub $EP =="
              curl -s -m 30 -o /tmp/out.json -w "HTTP %{http_code}\n" "https://finnhub.io/api/v1/$EP&token=$FINNHUB_API_KEY"
              head -c 700 /tmp/out.json; echo
            done
          done

      - name: Yahoo upgrade/downgrade history via yfinance
        run: |
          pip install --quiet yfinance
          python - <<'PY'
          import yfinance as yf
          for t in ("MPC", "COP"):
              print(f"== yfinance upgrades_downgrades {t} ==")
              try:
                  df = yf.Ticker(t).upgrades_downgrades
                  if df is None or len(df) == 0:
                      print("EMPTY")
                  else:
                      print("rows:", len(df))
                      print(df.head(8).to_string())
              except Exception as exc:
                  print("ERROR:", type(exc).__name__, str(exc)[:300])
          PY
