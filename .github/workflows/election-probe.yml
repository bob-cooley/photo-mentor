name: Election probe

# One-shot diagnostic: runs the election fetcher with debug output and prints
# data.json, then reports what each race page says about votes counted.
# No upload. Lets the parser be checked without waiting for the long-running
# refresh job to finish.

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - run: python3 election/probe_discover.py
      - run: python3 election/fetch.py
      - run: python3 -c "import json;d=json.load(open('election/data.json'));[print(r['id'],r['called'],r.get('called_by'),r['reporting']) for s in d['sections'] for r in s['races']]"
